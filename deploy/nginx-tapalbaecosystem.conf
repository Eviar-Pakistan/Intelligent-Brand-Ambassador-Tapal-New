# nginx terminates http(s) and talks to Django (gunicorn on 127.0.0.1:8000).
# The React build in dist/ is served by nginx. Node on port 4173 is not required.
#
# Install:  sudo cp deploy/nginx-tapalbaecosystem.conf /etc/nginx/sites-available/tapalbaecosystem
#           sudo ln -sf /etc/nginx/sites-available/tapalbaecosystem /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d tapalbaecosystem.com -d www.tapalbaecosystem.com
#
# Change the root path if the repo is not under /home/ubuntu/...

upstream tapal_django {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name tapalbaecosystem.com www.tapalbaecosystem.com 15.252.157.44;

    root /home/ubuntu/Intelligent-Brand-Ambassador-Tapal-New/dist;
    index index.html;

    # Training videos and photo uploads
    client_max_body_size 300M;

    # Django API, auth, media, admin, and supervisor push / Firebase helpers
    location /api/ {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /auth/ {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location /admin {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin CSS/JS (collectstatic), not the Vite assets folder
    location /static/ {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /firebase-config.json {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /firebase-messaging-sw.js {
        proxy_pass http://tapal_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built React app (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
