# nginx in front of the Node frontend server (server/production.mjs on port 4173).
# Node serves the app and already forwards /api, /auth, /media, /admin, /static to Django (:8000),
# so nginx only terminates http(s) and passes everything to Node.
#
# Install:  sudo cp deploy/nginx-tapalbaecosystem.conf /etc/nginx/sites-available/tapalbaecosystem
#           sudo ln -s /etc/nginx/sites-available/tapalbaecosystem /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d tapalbaecosystem.com -d www.tapalbaecosystem.com

server {
    listen 80;
    server_name tapalbaecosystem.com www.tapalbaecosystem.com 15.252.157.44;

    # Training videos and photo uploads
    client_max_body_size 300M;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Transcribing a training video can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
